# /etc/nginx/sites-available/oracle-stats.io  --  static ORAKEL site.
# Root is a copied allow-list (ops/bin/publish_website.sh), never the repo's website/
# folder: website/config/ can hold credential files. certbot --nginx adds the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name oracle-stats.io www.oracle-stats.io;

    root /var/www/orakel;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # data files change after every prediction run; let browsers revalidate
    location ~* ^/(.*/)?data[^/]*\.js$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|css)$ {
        expires 7d;
    }

    # never serve dotfiles, config, logs or sources even if one ends up in the root
    location ~ /\. { deny all; }
    location ~* \.(py|json|csv|env|log|md)$ { deny all; }

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
